# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
wallpaper {
    monitor = DP-1
    path = ~/.config/hypr/select_wallpaper.jpg
    fit_mode = cover
}
wallpaper {
    monitor = HDMI-A-1
    path = ~/.config/hypr/select_wallpaper.jpg
    fit_mode = cover
}

# Laptop x360.
# wallpaper {
#     monitor = eDP-1
#     path = ~/.config/hypr/select_wallpaper.jpg
#     fit_mode = cover
# }
# wallpaper {
#     monitor = DP-2
#     path = ~/.config/hypr/select_wallpaper.jpg
#     fit_mode = cover
# }

# Enable splash text rendering over the wallpaper
splash = false
splash_offset = 20  # In percentage, the splash rendering offset relative to the bottom of the display.

# Fully disable ipc. Turn on if using dynamically set wallpapers on hyprland keybind integration.
ipc = off
